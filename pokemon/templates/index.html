{% extends 'base.html' %}

{% block content %}
<div class="container py-5">

    <h1 class="text-center mb-2">Pokédex</h1>
    <p class="text-center text-light mb-4">Explore o mundo Pokémon em tempo real</p>

    <!-- Barra de busca -->
    <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-6">
            <div class="input-group">
                <input type="text" id="pokemon-search" class="form-control"
                    placeholder="Buscar Pokémon (ex: pikachu)">
                <div class="input-group-append">
                    <button class="btn btn-danger" id="btn-search">Buscar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Onde os cards vão aparecer -->
    <div id="pokemon-container" class="row"></div>

    <!-- Botão carregar mais -->
    <div class="text-center mt-4">
        <button class="btn btn-outline-warning" id="btn-load-more">Carregar mais</button>
    </div>

</div>
{% endblock %}
