{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">

    <h2 class="text-center text-warning mb-2">Pokémon</h2>
    <p class="text-center text-light mb-4">Confira os primeiros da nossa lista</p>

    <!-- Barra de pesquisa em tempo real -->
    <div class="row justify-content-center mb-5">
        <div class="col-12 col-md-6">
            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text bg-dark border-danger text-warning">
                        <i class="fas fa-search"></i>
                    </span>
                </div>
                <input type="text" id="pesquisa-pokemon" class="form-control" placeholder="Pesquisar Pokémon...">
            </div>
        </div>
    </div>

    <p id="msg-nao-encontrado" class="text-center text-light" style="display: none;">
        <i class="fas fa-exclamation-circle text-danger mr-2"></i>Pokémon não encontrado.
    </p>

    <div class="row" id="pokemon-container">
        {% for pokemon in pokemons %}
        <div class="col-6 col-md-4 col-lg-3 mb-4 pokemon-item" data-nome="{{ pokemon.nome }}">
            <div class="card card-pokemon h-100 text-center">
                <div class="card-img-wrapper">
                    <img src="{{ pokemon.imagem }}" class="card-img-top" alt="{{ pokemon.nome }}">
                </div>
                <div class="card-body">
                    <span class="pokemon-number">#{{ pokemon.id }}</span>
                    <h5 class="card-title text-capitalize">{{ pokemon.nome }}</h5>
                    <div class="d-flex justify-content-center flex-wrap">
                        {% for tipo in pokemon.tipos %}
                        <span class="badge badge-tipo tipo-{{ tipo }}">{{ tipo }}</span>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
